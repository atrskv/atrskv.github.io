<!DOCTYPE html>
<!-- Neon Drive by Paul Bakaus, MIT license; adapted for Catppuccin Mocha and monochrome.
     Source: https://github.com/pbakaus/radiant/blob/main/static/neon-drive.html -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Drive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .label {
    position: fixed;
    top: 20px;
    left: 24px;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(200, 149, 108, 0.5);
    z-index: 10;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
// ─────────────────────────────────────────────
// 40 · Neon Drive — Synthwave outrun horizon shader
// ─────────────────────────────────────────────
(function () {
  var canvas = document.getElementById('canvas');
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isLight = function () {
    return !window.parent.document.documentElement.classList.contains('dark');
  };

  var _pad = parseFloat(new URLSearchParams(location.search).get('p')) || 1;

  var gl = canvas.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: false });
  if (!gl) return;
  canvas.addEventListener('webglcontextlost', function (event) {
    event.preventDefault();
  });
  canvas.addEventListener('webglcontextrestored', function () {
    window.location.reload();
  });

  var vertSrc = [
    'attribute vec2 a_pos;',
    'void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }'
  ].join('\n');

  var fragSrc = [
    'precision highp float;',
    'uniform float u_time;',
    'uniform vec2 u_res;',
    'uniform float u_speed;',
    'uniform float u_glow;',
    'uniform float u_light;',
    'uniform vec2 u_mouse;',
    '',
    '// ── Horizon position ──',
    'const float HORIZON = 0.06;',
    '',
    '// ── Hash / noise helpers ──',
    'float hash(vec2 p) {',
    '  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);',
    '}',
    '',
    'float noise(vec2 p) {',
    '  vec2 i = floor(p);',
    '  vec2 f = fract(p);',
    '  f = f * f * (3.0 - 2.0 * f);',
    '  float a = hash(i);',
    '  float b = hash(i + vec2(1.0, 0.0));',
    '  float c = hash(i + vec2(0.0, 1.0));',
    '  float d = hash(i + vec2(1.0, 1.0));',
    '  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
    '}',
    'float smoothLine(float distance, float width, float pixelWidth) {',
    '  float radius = max(width, pixelWidth * 0.65);',
    '  return 1.0 - smoothstep(max(radius - pixelWidth * 0.5, 0.0),',
    '                          radius + pixelWidth * 0.5, distance);',
    '}',
    '',
    '// ── Sky gradient with stars ──',
    'vec3 sky(vec2 uv, float t) {',
    '  // Deep purple to hot pink to orange gradient',
    '  float skyY = (uv.y - HORIZON) / (1.0 - HORIZON);',
    '  skyY = clamp(skyY, 0.0, 1.0);',
    '',
    '  vec3 colBot = vec3(0.28, 0.22, 0.39);',
    '  vec3 colMid = vec3(0.17, 0.16, 0.27);',
    '  vec3 colTop = vec3(0.07, 0.07, 0.11);',
    '',
    '  vec3 col = mix(colBot, colMid, smoothstep(0.0, 0.35, skyY));',
    '  col = mix(col, colTop, smoothstep(0.25, 0.85, skyY));',
    '',
    '  // Horizon haze — warm orange glow right at the horizon',
    '  float hazeStrength = exp(-skyY * 8.0) * 0.7;',
    '  col += vec3(0.80, 0.65, 0.97) * hazeStrength * 0.5;',
    '',
    '  return col;',
    '}',
    '',
    '// ── Perspective grid road ──',
    'vec3 grid(vec2 uv, float t) {',
    '  // Road below horizon',
    '  float roadY = HORIZON - uv.y;',
    '  if (roadY <= 0.0) return vec3(0.0);',
    '',
    '  // Perspective projection: map screen Y to world Z',
    '  // Higher constant = more grid cells visible = denser grid',
    '  float perspective = 0.9 / roadY;',
    '  float worldX = uv.x * perspective;',
    '  float worldZ = perspective;',
    '',
    '  // Forward motion',
    '  float speed = t * u_speed * 3.0;',
    '  worldZ += speed;',
    '',
    '  // ── Grid lines ──',
    '',
    '  // Z lines (horizontal in perspective, running left-right)',
    '  float zLine = abs(fract(worldZ * 0.5) - 0.5);',
    '  float zLineWidth = clamp(perspective * 0.00065, 0.006, 0.08) * mix(1.0, 0.5, u_light);',
    '',
    '  // X lines (vertical in perspective, running into distance)',
    '  float xLine = abs(fract(worldX * 0.25) - 0.5);',
    '  float xLineWidth = clamp(perspective * 0.0003, 0.004, 0.05) * mix(1.0, 0.5, u_light);',
    '',
    '  float zPixel = 0.45 / (roadY * roadY * u_res.y);',
    '  float xPixel = 0.225 * (roadY + abs(uv.x)) / (roadY * roadY * u_res.y);',
    '  float zVisibility = 1.0 - smoothstep(0.08, 0.20, zPixel);',
    '  float xVisibility = 1.0 - smoothstep(0.08, 0.20, xPixel);',
    '  float zInk = smoothLine(zLine, zLineWidth, zPixel) * zVisibility;',
    '  float xInk = smoothLine(xLine, xLineWidth, xPixel) * xVisibility;',
    '  float gridVal = max(zInk, xInk);',
    '',
    '  // Distance fade — fade in from horizon, stay visible to camera',
    '  float fadeIn = smoothstep(0.10, 0.30, roadY);',
    '',
    '  // Brightness increases slightly near camera for depth cue',
    '  float proxBright = 0.5 + 0.5 * smoothstep(0.0, 0.4, roadY);',
    '  if (u_light > 0.5) return vec3(gridVal * proxBright);',
    '',
    '  // Grid colors: main neon pink/magenta, with cyan accents',
    '  vec3 gridColor = vec3(0.80, 0.65, 0.97);',
    '',
    '  // Accent every 4th line with cyan',
    '  float zMajor = abs(fract(worldZ * 0.125) - 0.5);',
    '  float zMajorLine = 1.0 - smoothstep(0.0, zLineWidth * 0.5, zMajor);',
    '  float xMajor = abs(fract(worldX * 0.0625) - 0.5);',
    '  float xMajorLine = 1.0 - smoothstep(0.0, xLineWidth * 0.5, xMajor);',
    '  float majorGrid = max(zMajorLine, xMajorLine);',
    '',
    '  vec3 accentColor = vec3(0.54, 0.71, 0.98);',
    '  gridColor = mix(gridColor, accentColor, majorGrid * 0.4);',
    '',
    '  // Grid glow — soft bloom around grid lines',
    '  float zGlow = exp(-zLine * 20.0) * 0.25 * zVisibility;',
    '  float xGlow = exp(-xLine * 20.0) * 0.2 * xVisibility;',
    '  float gridGlow = max(zGlow, xGlow);',
    '',
    '  float lineStrength = mix(0.58, 1.0, u_light);',
    '  vec3 col = gridColor * gridVal * proxBright * fadeIn * lineStrength;',
    '  col += gridColor * gridGlow * fadeIn * 0.7 * lineStrength;',
    '',
    '  // Ground base color — very dark with slight purple tint',
    '  vec3 groundColor = vec3(0.07, 0.07, 0.11);',
    '  col += groundColor;',
    '',
    '  // Horizon fog glow — warm/pink mist at the horizon',
    '  float fogBand = exp(-roadY * 10.0);',
    '  col += vec3(0.80, 0.65, 0.97) * fogBand * 0.3;',
    '',
    '  return col;',
    '}',
    '',
    '// ── Side grid (ground extending beyond the road) ──',
    'vec3 sideGrid(vec2 uv, float t) {',
    '  float roadY = HORIZON - uv.y;',
    '  if (roadY <= 0.0) return vec3(0.0);',
    '',
    '  float perspective = 0.9 / roadY;',
    '  float worldX = uv.x * perspective;',
    '  float worldZ = perspective + t * u_speed * 3.0;',
    '',
    '  // Same grid density as the road',
    '  float zLine = abs(fract(worldZ * 0.5) - 0.5);',
    '  float xLine = abs(fract(worldX * 0.25) - 0.5);',
    '',
    '  float zLineWidth = clamp(perspective * 0.0005, 0.005, 0.055) * mix(1.0, 0.5, u_light);',
    '  float xLineWidth = clamp(perspective * 0.00025, 0.003, 0.04) * mix(1.0, 0.5, u_light);',
    '',
    '  float zPixel = 0.45 / (roadY * roadY * u_res.y);',
    '  float xPixel = 0.225 * (roadY + abs(uv.x)) / (roadY * roadY * u_res.y);',
    '  float zVisibility = 1.0 - smoothstep(0.08, 0.20, zPixel);',
    '  float xVisibility = 1.0 - smoothstep(0.08, 0.20, xPixel);',
    '  float zInk = smoothLine(zLine, zLineWidth, zPixel) * zVisibility;',
    '  float xInk = smoothLine(xLine, xLineWidth, xPixel) * xVisibility;',
    '  float gridVal = max(zInk, xInk);',
    '  if (u_light > 0.5) return vec3(gridVal * 0.65);',
    '',
    '  float fadeIn = smoothstep(0.10, 0.30, roadY);',
    '',
    '  // Slightly different color for side terrain grid — purple',
    '  vec3 sideColor = vec3(0.58, 0.49, 0.84);',
    '  return sideColor * gridVal * fadeIn * 0.35 * mix(0.58, 1.0, u_light);',
    '}',
    '',
    '// ── Center road line ──',
    'vec3 centerLine(vec2 uv, float t) {',
    '  float roadY = HORIZON - uv.y;',
    '  if (roadY <= 0.0) return vec3(0.0);',
    '',
    '  float perspective = 0.9 / roadY;',
    '  float worldZ = perspective + t * u_speed * 3.0;',
    '',
    '  // Dashed center line',
    '  float dashPattern = step(0.5, fract(worldZ * 0.12));',
    '',
    '  // Line width in screen space narrows toward horizon',
    '  float lineWidth = 0.002 / (perspective * 0.05 + 0.1) * mix(1.0, 0.5, u_light);',
    '  lineWidth = clamp(lineWidth, 0.0005, 0.01);',
    '',
    '  float lineMask = 1.0 - smoothstep(0.0, lineWidth, abs(uv.x));',
    '  if (u_light > 0.5) return vec3(smoothLine(abs(uv.x), lineWidth, 1.0 / u_res.y) * dashPattern * 0.75);',
    '  float distFade = smoothstep(0.04, 0.10, roadY) * (1.0 - smoothstep(0.05, 0.35, roadY));',
    '',
    '  return vec3(0.80, 0.84, 0.96) * lineMask * dashPattern * distFade * 0.5 * mix(0.58, 1.0, u_light);',
    '}',
    '',
    '// ── Road edge glow lines ──',
    'vec3 roadEdges(vec2 uv, float t) {',
    '  float roadY = HORIZON - uv.y;',
    '  if (roadY <= 0.0) return vec3(0.0);',
    '',
    '  // Road edges converge toward center at horizon',
    '  float roadHalfWidth = roadY * 0.8 + 0.001;',
    '',
    '  float leftEdge = abs(uv.x + roadHalfWidth);',
    '  float rightEdge = abs(uv.x - roadHalfWidth);',
    '  float edgeDist = min(leftEdge, rightEdge);',
    '',
    '  float lineWidth = 0.0012 * mix(1.0, 0.5, u_light);',
    '  float edgeLine = 1.0 - smoothstep(0.0, lineWidth, edgeDist);',
    '  if (u_light > 0.5) return vec3(smoothLine(edgeDist, lineWidth, 1.3 / u_res.y) * 0.75);',
    '  float edgeGlow = exp(-edgeDist * 300.0) * 0.4;',
    '',
    '  float distFade = smoothstep(0.04, 0.10, roadY) * (1.0 - smoothstep(0.02, 0.35, roadY));',
    '',
    '  vec3 edgeColor = vec3(0.58, 0.89, 0.84);',
    '  return edgeColor * (edgeLine + edgeGlow) * distFade * mix(0.58, 1.0, u_light);',
    '}',
    '',
    '// ── Atmospheric haze particles ──',
    'float haze(vec2 uv, float t) {',
    '  float n1 = noise(uv * 3.0 + vec2(t * 0.1, 0.0));',
    '  float n2 = noise(uv * 7.0 + vec2(0.0, t * 0.15));',
    '  float n3 = noise(uv * 15.0 + vec2(t * 0.05, t * 0.08));',
    '  return (n1 * 0.5 + n2 * 0.3 + n3 * 0.2);',
    '}',
    '',
    '// ── Vignette ──',
    'float vignette(vec2 uv) {',
    '  float d = length(uv * vec2(0.8, 1.0));',
    '  return smoothstep(1.2, 0.4, d);',
    '}',
    'float lightInk(vec2 uv, float t) {',
    '  vec3 lines = grid(uv, t) + sideGrid(uv, t) + roadEdges(uv, t) + centerLine(uv, t);',
    '  return clamp(lines.r * 2.0, 0.0, 1.0);',
    '}',
    '',
    'void main() {',
    '  // ── Mouse: shift vanishing point ──',
    '  vec2 vpShift = vec2(0.0);',
    '  if (u_mouse.x > 0.0) {',
    '    vec2 mNorm = u_mouse / u_res;',
    '    vpShift = (mNorm - 0.5) * vec2(0.3, 0.15);',
    '  }',
    '  vec2 uv = (gl_FragCoord.xy - u_res * 0.5) / u_res.y - vpShift;',
    '  vec2 screenUV = gl_FragCoord.xy / u_res;',
    '  float t = u_time;',
    '',
    '  if (u_light > 0.5) {',
    '    float sampleOffset = 0.35 / u_res.y;',
    '    float ink = 0.5 * (lightInk(uv + vec2(0.0, sampleOffset), t)',
    '                     + lightInk(uv - vec2(0.0, sampleOffset), t));',
    '    float fade = smoothstep(0.10, 0.35, HORIZON - uv.y);',
    '    gl_FragColor = vec4(vec3(1.0 - ink * fade), 1.0);',
    '    return;',
    '  }',
    '',
    '  vec3 road = grid(uv, t) + sideGrid(uv, t) + roadEdges(uv, t) + centerLine(uv, t);',
    '  if (uv.y >= HORIZON) {',
    '    road = vec3(0.07, 0.07, 0.11) + vec3(0.80, 0.65, 0.97) * 0.3;',
    '  }',
    '  float skyBlend = mix(smoothstep(HORIZON - 0.30, HORIZON + 0.12, uv.y),',
    '                       step(HORIZON, uv.y), u_light);',
    '  vec3 col = mix(road, sky(uv, t), skyBlend);',
    '',
    '  // Atmospheric haze near horizon',
    '  float horizonDist = abs(uv.y - HORIZON);',
    '  float hazeMask = exp(-horizonDist * mix(7.0, 15.0, u_light));',
    '  float hazeVal = haze(uv, t);',
    '  col += vec3(0.80, 0.65, 0.97) * hazeVal * hazeMask * 0.15;',
    '',
    '  // Global glow control',
    '  col *= u_glow;',
    '',
    '  // Vignette',
    '  col *= vignette(uv);',
    '',
    '  // Tone mapping — slight S-curve for richer darks',
    '  col = col / (col + vec3(0.8));',
    '  col = pow(col, vec3(0.95));',
    '',
    '  gl_FragColor = vec4(col, 1.0);',
    '}',
  ].join('\n');

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('Shader compile error:', gl.getShaderInfoLog(s));
    }
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vertSrc));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var uTime = gl.getUniformLocation(prog, 'u_time');
  var uRes = gl.getUniformLocation(prog, 'u_res');
  var uSpeed = gl.getUniformLocation(prog, 'u_speed');
  var uGlow = gl.getUniformLocation(prog, 'u_glow');
  var uLight = gl.getUniformLocation(prog, 'u_light');
  var uMouse = gl.getUniformLocation(prog, 'u_mouse');

  var mouseXVal = -1.0, mouseYVal = -1.0;

  canvas.addEventListener('mousemove', function(e) {
    mouseXVal = e.clientX * dpr;
    mouseYVal = (canvas.clientHeight - e.clientY) * dpr;
  });
  canvas.addEventListener('mouseleave', function() {
    mouseXVal = -1.0; mouseYVal = -1.0;
  });
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var touch = e.touches[0];
    mouseXVal = touch.clientX * dpr;
    mouseYVal = (canvas.clientHeight - touch.clientY) * dpr;
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var touch = e.touches[0];
    mouseXVal = touch.clientX * dpr;
    mouseYVal = (canvas.clientHeight - touch.clientY) * dpr;
  }, { passive: false });
  canvas.addEventListener('touchend', function() {
    mouseXVal = -1.0; mouseYVal = -1.0;
  });

  var speedVal = 0.75;
  var glowVal = 1.0;

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var needsResize = true;

  function resize() {
    needsResize = false;
    var w = Math.round(canvas.clientWidth * dpr);
    var h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
      gl.uniform2f(uRes, canvas.width, canvas.height);
    }
  }

  function render(now) {
    if (needsResize) resize();
    gl.uniform1f(uTime, prefersReduced ? 0.0 : now * 0.00019);
    gl.uniform1f(uSpeed, speedVal);
    gl.uniform1f(uGlow, glowVal);
    gl.uniform1f(uLight, isLight() ? 1.0 : 0.0);
    gl.uniform2f(uMouse, mouseXVal, mouseYVal);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(render);
  }

  window.addEventListener('resize', function () {
    needsResize = true;
  });

  resize();

  requestAnimationFrame(render);

  window.addEventListener('message', function(e) {
    if (e.origin !== location.origin) return;
    if (e.data && e.data.type === 'pointer') {
      if (typeof e.data.x === 'number' && typeof e.data.y === 'number') {
        mouseXVal = e.data.x * dpr;
        mouseYVal = (canvas.clientHeight - e.data.y) * dpr;
      } else {
        mouseXVal = -1.0;
        mouseYVal = -1.0;
      }
    }
    if (e.data && e.data.type === 'param') {
      switch (e.data.name) {
        case 'speed': speedVal = e.data.value; break;
        case 'glow': glowVal = e.data.value; break;
      }
    }
  });
})();
</script>
</body>
</html>
