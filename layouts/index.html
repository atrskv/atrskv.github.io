{{ define "body_classes" }}page-home{{ end }}

{{ define "main" }}
  {{ if .Site.Params.showAuthorOnHomepage }}
    {{ partial "author-large.html" . }}
  {{ end }}

  <section class="visitor-terminal" aria-label="Интерактивный терминал">
    <div class="terminal" id="terminal" data-prompt="$">
      <div class="terminal-bar" aria-hidden="true">
        <span class="terminal-lights"><i></i><i></i><i></i></span>
      </div>
      <div class="terminal-screen" id="terminal-screen" tabindex="0" aria-label="История терминала">
        <div id="terminal-output" role="log" aria-label="Ответы терминала" aria-live="polite" aria-relevant="additions"></div>
        <form class="terminal-input-row" id="terminal-form" autocomplete="off" hidden>
          <label for="terminal-input" class="terminal-prompt">$</label>
          <span class="terminal-entry">
            <input id="terminal-input" name="command" type="text" aria-label="Команда терминала. Введите help, чтобы узнать команды" placeholder=" " autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="200" enterkeyhint="send">
            <span class="terminal-placeholder" aria-hidden="true"><span id="terminal-suggestion"></span><span class="terminal-caret"></span></span>
          </span>
        </form>
      </div>
    </div>
    <noscript><div class="terminal-noscript">{{ .Content }}<p>Для ввода команд нужен JavaScript.</p></div></noscript>
  </section>
  <style>
.visitor-terminal {
  --terminal-bg: #fff;
  --terminal-border: #ccc;
  --terminal-ink: #000;
  --terminal-muted: #626273;
  --terminal-accent: #000;
  --terminal-success: #247441;
  --terminal-inset: 20px;
  --terminal-line-height: 1.5;
  --terminal-command-gap: 8px;
  --terminal-prompt-gap: 1ch;
  margin-top: 30px;
}
html.dark .visitor-terminal {
  --terminal-bg: #181825;
  --terminal-border: #313244;
  --terminal-ink: #cdd6f4;
  --terminal-muted: #a6adc8;
  --terminal-accent: #b4befe;
  --terminal-success: #a6e3a1;
}
.visitor-terminal .terminal {
  background: var(--terminal-bg);
  color: var(--terminal-ink);
  border: 1px solid var(--terminal-border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0, 0, 0, .1);
  position: relative;
  padding: var(--terminal-inset);
  width: 100%;
  box-sizing: border-box;
  font: 16px/var(--terminal-line-height) 'Fira Code', monospace;
}
html.dark .visitor-terminal .terminal { box-shadow: 0 0 20px rgba(0, 0, 0, .4); }
.visitor-terminal .terminal-bar { position: absolute; top: var(--terminal-inset); left: var(--terminal-inset); }
.visitor-terminal .terminal-lights { display: flex; gap: 8px; }
.visitor-terminal .terminal-lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f56; }
.visitor-terminal .terminal-lights i:nth-child(2) { background: #ffbd2e; }
.visitor-terminal .terminal-lights i:nth-child(3) { background: #27c93f; }
html.dark .visitor-terminal .terminal-lights i { background: #f38ba8; }
html.dark .visitor-terminal .terminal-lights i:nth-child(2) { background: #f9e2af; }
html.dark .visitor-terminal .terminal-lights i:nth-child(3) { background: #a6e3a1; }
.visitor-terminal .terminal-screen {
  box-sizing: border-box;
  height: clamp(260px, 48vh, 420px);
  min-height: 0;
  margin-top: calc(12px + var(--terminal-inset));
  max-height: none;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 0;
  scrollbar-color: var(--terminal-border) var(--terminal-bg);
}
.visitor-terminal .terminal-input-row[hidden] { display: none; }
.visitor-terminal .terminal-input-row { display: flex; align-items: baseline; gap: var(--terminal-prompt-gap); margin: 0; padding: 0; }
.visitor-terminal .terminal-prompt { flex-shrink: 0; color: var(--terminal-ink); font-weight: normal; }
.visitor-terminal .terminal-entry { position: relative; display: block; flex: 1; min-width: 0; }
.visitor-terminal .terminal-placeholder {
  position: absolute; left: 0; top: 0; display: inline-flex; align-items: center;
  height: 100%; pointer-events: none; color: var(--terminal-ink); white-space: pre;
}
.visitor-terminal .terminal-caret {
  display: inline-block; width: 1ch; height: 1em;
  pointer-events: none; background: var(--terminal-ink);
  animation: terminal-blink 1s step-start infinite;
}
.visitor-terminal #terminal-input:not(:placeholder-shown) + .terminal-placeholder { display: none; }
.visitor-terminal #terminal-input:placeholder-shown { caret-color: transparent; }
.visitor-terminal #terminal-input {
  display: block;
  flex: 1;
  min-width: 0;
  width: 100%;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--terminal-ink);
  caret-color: var(--terminal-accent);
  font: inherit;
  padding: 0;
  margin: 0;
  box-shadow: none;
  box-sizing: border-box;
}
.visitor-terminal #terminal-input:focus { outline: none; }
.visitor-terminal #terminal-output, .visitor-terminal .terminal-run { display: flow-root; }
.visitor-terminal .terminal-line {
  margin: 0;
  line-height: var(--terminal-line-height);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.visitor-terminal .terminal-command {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  column-gap: var(--terminal-prompt-gap);
  margin-top: var(--terminal-command-gap);
  margin-bottom: var(--terminal-command-gap);
}
.visitor-terminal #terminal-output > .terminal-command:first-child,
.visitor-terminal .terminal-run > .terminal-command:first-child { margin-top: 0; }
.visitor-terminal #terminal-output:not(:empty) { padding-bottom: var(--terminal-command-gap); }
.visitor-terminal .terminal-empty-command { margin-bottom: 0; }
.visitor-terminal .terminal-empty-command + .terminal-command { margin-top: 0; }
.visitor-terminal #terminal-output:has(> .terminal-empty-command:last-child) { padding-bottom: 0; }
.visitor-terminal .terminal-success { color: var(--terminal-success); }
.visitor-terminal .terminal-test-result { color: var(--terminal-success); font-weight: bold; }
.visitor-terminal .terminal-line:empty { min-height: 1.5em; }
.visitor-terminal .terminal-muted { color: var(--terminal-muted); }
.visitor-terminal .terminal-line a { color: var(--terminal-accent); font-weight: bold; text-decoration: underline; }
.visitor-terminal .terminal-source { text-align: center; margin-top: var(--terminal-command-gap); }
.visitor-terminal .terminal-separator { display: flex; align-items: center; gap: var(--terminal-prompt-gap); color: var(--terminal-ink); font-weight: bold; margin: 0; }
.visitor-terminal .terminal-separator::before, .visitor-terminal .terminal-separator::after { content: '========================================'; overflow: hidden; white-space: nowrap; min-width: 0; flex: 1; }
.visitor-terminal .terminal-screen:focus-visible { outline: 2px solid var(--terminal-accent); outline-offset: 3px; }
.visitor-terminal .terminal-noscript { margin-top: 20px; }
@media (max-width: 600px) {
  .visitor-terminal .terminal-screen { height: 300px; height: min(300px, 50svh); }
  .visitor-terminal { --terminal-inset: 16px; }
}
@media (max-width: 480px) {
  .visitor-terminal .terminal-screen { padding: 0; }
  .visitor-terminal #terminal-input, .visitor-terminal .terminal-placeholder { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .visitor-terminal * { transition: none !important; }
}

.visitor-terminal .terminal-typing::after {
  content: ''; display: inline-block; width: 1ch; height: 1em;
  margin-left: 0; vertical-align: text-bottom;
  background: var(--terminal-ink); animation: terminal-blink 1s step-start infinite;
}
@keyframes terminal-blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .visitor-terminal .terminal-typing::after, .visitor-terminal .terminal-caret { animation: none; } }
  </style>
{{ end }}

{{ define "footer_js" }}
  {{ $terminal := resources.Get "js/terminal.js" }}
  <script>{{ $terminal.Content | safeJS }}</script>
{{ end }}
