<script>
(function() {
  var checkbox = document.getElementById('theme-checkbox');
  var favicon = document.getElementById('favicon');
  if (checkbox) {
    checkbox.checked = document.documentElement.classList.contains('dark');
    checkbox.addEventListener('change', function() {
      if (checkbox.checked) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        if (favicon) favicon.href = favicon.dataset.dark;
      } else {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        if (favicon) favicon.href = favicon.dataset.light;
      }
      if (typeof DISQUS !== 'undefined') DISQUS.reset({ reload: true });
    });
  }

  var modal = document.getElementById('stack-modal');
  if (!modal) return;

  var model = modal.querySelector('model-viewer');
  var modelStatus = modal.querySelector('.stack-model-status');
  var modelRetry = modal.querySelector('.stack-model-retry');
  var modelLibrary;
  var modelStarting = false;

  function syncModelRotation() {
    if (!model) return;
    model.setAttribute('auto-rotate-delay', '0');
    if (modal.classList.contains('open')) {
      model.setAttribute('auto-rotate', '');
    } else {
      model.removeAttribute('auto-rotate');
    }
  }

  function modelFailed(error) {
    modelStarting = false;
    modelStatus.textContent = 'Не удалось загрузить 3D-модель';
    modelStatus.hidden = false;
    modelRetry.hidden = false;
    console.error('Stack model failed:', error);
  }

  function loadModelLibrary() {
    if (customElements.get('model-viewer')) return Promise.resolve();
    if (!modelLibrary) {
      modelLibrary = import('https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js')
        .catch(function() {
          return import('https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js');
        }).catch(function(error) {
          modelLibrary = null;
          throw error;
        });
    }
    return modelLibrary;
  }

  function startModel() {
    if (!model || model.loaded || modelStarting) return;
    modelStarting = true;
    modelRetry.hidden = true;
    modelStatus.hidden = false;
    modelStatus.textContent = 'Загрузка 3D-модели…';
    loadModelLibrary().then(function() {
      // Start WebGL only after the modal is visible and has a layout.
      requestAnimationFrame(function() {
        if (!modal.classList.contains('open')) {
          modelStarting = false;
          return;
        }
        model.setAttribute('src', model.dataset.src);
      });
    }).catch(modelFailed);
  }

  if (model) {
    model.addEventListener('load', function() {
      modelStarting = false;
      syncModelRotation();
      model.classList.add('is-ready');
      modelStatus.hidden = true;
      modelRetry.hidden = true;
    });
    model.addEventListener('error', function(event) { modelFailed(event.detail); });
    modelRetry.addEventListener('click', function() {
      model.removeAttribute('src');
      startModel();
    });
    if (model.loaded) {
      model.classList.add('is-ready');
    }
  }

  var closeBtn = document.getElementById('stack-modal-close');
  var STORAGE_KEY = 'openStackModal';
  var savedScrollY = 0;

  function openModal() {
    if (modal.classList.contains('open')) return;
    savedScrollY = window.scrollY;
    document.body.style.setProperty('--stack-scroll-top', -savedScrollY + 'px');
    document.documentElement.classList.add('stack-open');
    var menuContainer = document.getElementById('menu-main-mobile');
    var hamburgerIcon = document.querySelector('.hamburger');
    if (menuContainer) menuContainer.classList.remove('open');
    if (hamburgerIcon) hamburgerIcon.classList.remove('is-active');
    modal.classList.add('open');
    document.body.classList.add('lock-scroll');
    document.body.classList.add('stack-open');
    syncModelRotation();
    startModel();
  }

  function closeModal() {
    if (!modal.classList.contains('open')) return;
    modal.classList.remove('open');
    syncModelRotation();
    document.body.classList.remove('lock-scroll');
    document.body.classList.remove('stack-open');
    document.documentElement.classList.remove('stack-open');
    document.body.style.removeProperty('--stack-scroll-top');
    window.scrollTo(0, savedScrollY);
  }

  function handleClose() {
    closeModal();
    if (history.state && history.state.stackModal) {
      history.back();
    }
  }

  // Direct URL /stack/ — redirect to home, open modal there
  if (window.location.pathname === '/stack/' || window.location.pathname === '/stack') {
    sessionStorage.setItem(STORAGE_KEY, '1');
    window.location.replace('/');
    return;
  }

  // After redirect from /stack/ — open modal on home page
  if (sessionStorage.getItem(STORAGE_KEY)) {
    sessionStorage.removeItem(STORAGE_KEY);
    history.pushState({ stackModal: true }, '', '/stack/');
    openModal();
  }

  // Intercept all link clicks that open the stack modal
  document.addEventListener('click', function(e) {
    var link = e.target.closest('a');
    if (link && link.getAttribute('href') && link.getAttribute('href').indexOf('stack-modal') !== -1) {
      e.preventDefault();
      history.pushState({ stackModal: true }, '', '/stack/');
      openModal();
    }
  });

  if (closeBtn) closeBtn.addEventListener('click', handleClose);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) {
      handleClose();
    }
  });

  // Browser back/forward button
  window.addEventListener('popstate', function() {
    if (window.location.pathname === '/stack/' || window.location.pathname === '/stack') {
      openModal();
    } else {
      closeModal();
    }
  });
})();
</script>
